[project]
name = "cyberrel"
version = "1.0.0"
description = "Cyber attacks measured in the units of reliability engineering: MTBF, availability and mission-capable rate of a synthetic cyber-physical system under physical failures and effect-level attack scenarios."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gabriel Milanez Cavalheri" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    # CPS-02, used only by the cross-check test that ties this project's physical baseline
    # to the unified RBD + attack-tree model of the same synthetic system
    "cpsrbd",
    "hypothesis>=6.100",
    "ipykernel>=6.29",
    "mypy>=1.11",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "scipy-stubs>=1.13",
]

[tool.uv.sources]
cpsrbd = { git = "https://github.com/GMCavalheri/cyber-physical-rbd-attack-trees", tag = "v1.0.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberrel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["cyberrel"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# notebooks are generated by notebooks/build_notebooks.py; lint that file instead
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = [
    "E741",  # single-letter math names (l, I) are idiomatic here
]

[tool.ruff.lint.per-file-ignores]
"notebooks/build_notebooks.py" = ["E501"]  # notebook cell sources are string literals

[tool.ruff.lint.isort]
# validation/ scripts import their sibling helper module directly
known-local-folder = ["common"]
